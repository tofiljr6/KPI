<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KIP – Skill Chat</title>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-async="true"
    data-sap-ui-compat-version="edge"
    data-sap-ui-resource-roots='{ "kip.chat": "./" }'
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-frame-options="trusted">
  </script>
</head>
<body class="sapUiBody kipChatBody">
  <div data-sap-ui-component data-name="kip.chat" data-id="chatContainer" data-settings='{"id":"kip.chat"}' style="height:100%"></div>
</body>
</html>
